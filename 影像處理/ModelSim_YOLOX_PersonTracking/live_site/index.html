<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USB 人物追蹤 · 即時影像</title><meta name="description" content="本機 USB 攝影機即時人物偵測與追蹤"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23102532'/%3E%3Cpath d='M8 12V8h5m6 0h5v5m0 6v5h-5m-6 0H8v-5' fill='none' stroke='%237be3b2' stroke-width='3'/%3E%3C/svg%3E"><style>
:root{color-scheme:dark;--bg:#0a121b;--card:#111f2c;--line:#283846;--muted:#9aaeba;--green:#7be3b2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf5f8;font:16px system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1380px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}h1{font-size:25px;letter-spacing:.04em;margin:0}h1 small{display:block;color:var(--muted);font-size:13px;font-weight:400;letter-spacing:0;margin-top:7px}.pill{border:1px solid var(--line);padding:8px 13px;border-radius:24px;font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px}.feed,.side{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}.bar{padding:17px 21px;display:flex;justify-content:space-between;align-items:center;font-size:14px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#82939e;margin-right:9px}.live .dot{background:var(--green);box-shadow:0 0 14px #7be3b255}.viewport{aspect-ratio:4/3;background:#050b10;position:relative;display:grid;place-items:center}.viewport img{width:100%;height:100%;object-fit:contain;position:absolute}.empty{padding:36px;text-align:center;color:var(--muted);max-width:440px;line-height:1.7}.empty svg{width:54px;display:block;margin:0 auto 16px;stroke:#5c7988}.empty strong{color:#e0edf3;display:block;margin-bottom:8px}.foot{padding:14px 20px;display:flex;gap:24px;color:var(--muted);font-size:13px}.side{padding:23px}h2{font-size:14px;font-weight:500;margin:0 0 16px;color:var(--muted)}.count{font-size:54px;font-weight:650;line-height:1.1}.count small{font-size:15px;color:var(--muted);font-weight:400;margin-left:10px}#statusText{font-size:15px;color:var(--green);margin:16px 0 24px;line-height:1.6;min-height:25px}.tracks{border-top:1px solid var(--line);padding-top:18px;min-height:125px}.person{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px}.person b{color:var(--green)}.muted{color:var(--muted);font-size:13px;line-height:1.7}.controls{border-top:1px solid var(--line);padding-top:22px;margin-top:20px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}select,button{font:inherit;border-radius:9px;padding:12px;border:1px solid var(--line)}select{width:100%;background:#0a1620;color:#edf5f8;margin-bottom:12px}button{cursor:pointer;font-size:14px;font-weight:600}button:focus-visible,select:focus-visible{outline:3px solid #b1f9d7;outline-offset:3px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{background:var(--green);color:#08231a;border:0}.secondary{background:transparent;color:#d7e5ea}.note{color:var(--muted);font-size:12px;line-height:1.9;margin-top:20px}footer{margin-top:20px;color:#718896;font-size:12px}#netError{background:#542622;color:#ffd5cb;padding:13px 18px;border-radius:10px;margin-bottom:20px} [hidden]{display:none!important}@media(max-width:900px){main{padding:18px}.grid{grid-template-columns:1fr}.side{padding:20px}.pill{display:none}header{margin-bottom:20px}.count{font-size:40px}.tracks{min-height:70px}}</style></head>
<body><main><header><h1>USB 人物追蹤<small>即時影像工作台</small></h1><span class="pill">僅在這台電腦處理 · 不自動錄影</span></header><div id="netError" role="alert" hidden>無法連接本機服務，請重新開啟「啟動即時追蹤網站」。</div><div class="grid"><section class="feed" aria-label="攝影機畫面"><div class="bar"><span id="connection"><i class="dot"></i><span id="connectionLabel">準備連線</span></span><span>640 × 480</span></div><div class="viewport"><img id="frame" alt="即時攝影機畫面，綠框標示人物與追蹤編號" hidden><div class="empty" id="empty"><svg viewBox="0 0 48 48" fill="none" stroke-width="2"><rect x="5" y="12" width="27" height="24" rx="4"/><path d="m32 20 11-6v20l-11-6"/></svg><strong id="emptyTitle">正在連接鏡頭</strong><span id="emptyMessage">請確認 USB 攝影機已插好。</span></div></div><div class="foot"><span>更新 <b id="fps">—</b> FPS</span><span>影像延遲 <b id="latency">—</b> ms</span></div></section><aside class="side"><h2>目前偵測到的人物</h2><div class="count"><span id="count">0</span><small>人</small></div><div id="statusText" role="status" aria-live="polite">正在準備偵測…</div><div class="tracks"><h2>追蹤編號</h2><div id="people" class="muted">人物進入畫面後會顯示編號。</div></div><div class="controls"><label for="camera">USB 鏡頭編號</label><select id="camera"><option value="0">鏡頭 0（預設）</option><option value="1">鏡頭 1</option><option value="2">鏡頭 2</option><option value="3">鏡頭 3</option></select><div class="buttons"><button class="primary" id="start">重新連線</button><button class="secondary" id="stop">停止攝影機</button></div></div><p class="note">沒有畫面時，可切換鏡頭編號再重新連線。<br>關閉頁面約 10 秒後會自動釋放鏡頭。</p></aside></div><footer>人物框由 YOLOX 偵測；追蹤編號由現有追蹤程式延續。編號不是人物身分辨識。</footer></main>
<script>
const $=id=>document.getElementById(id);let last=-1,connected=false,lastUpdate=0;
async function control(path){try{const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({camera:Number($('camera').value)})});if(!r.ok)throw Error();$('netError').hidden=true;}catch(e){$('netError').hidden=false}}
$('start').onclick=()=>control('start');$('stop').onclick=()=>control('stop');
function render(s){const live=s.status==='live'&&s.image;$('connection').className=live?'live':'';$('connectionLabel').textContent=live?'即時連線':s.status==='stopped'?'已停止':'等待連線';$('frame').hidden=!live;$('empty').hidden=!!live;if(live&&s.frame_id!==last){$('frame').src='data:image/jpeg;base64,'+s.image;last=s.frame_id;lastUpdate=Date.now()}$('emptyTitle').textContent=s.status==='stopped'?'攝影機已停止':s.status==='error'?'偵測暫時無法執行':'正在等待攝影機';$('emptyMessage').textContent=s.message;$('statusText').textContent=s.message;$('count').textContent=s.people.length;$('fps').textContent=live?s.fps:'—';$('latency').textContent=live?s.latency_ms:'—';$('people').replaceChildren();if(!s.people.length){$('people').textContent='人物進入畫面後會顯示編號。'}for(const p of s.people){const row=document.createElement('div');row.className='person';const name=document.createElement('b');name.textContent='ID '+p.track_id;const info=document.createElement('span');info.textContent=p.status==='confirmed'?'追蹤中 · '+Math.round(p.confidence*100)+'%':'建立追蹤中';row.append(name,info);$('people').append(row)}}
async function poll(){try{const r=await fetch('/api/live',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();$('netError').hidden=true;render(s);if(s.status==='live'&&Date.now()-lastUpdate>5000){$('statusText').textContent='影像暫停更新，請重新連線。';$('frame').hidden=true;$('empty').hidden=false;$('emptyTitle').textContent='影像暫停更新';}}catch(e){$('netError').hidden=false;$('frame').hidden=true;$('empty').hidden=false;$('connectionLabel').textContent='服務未連線';$('connection').className='';$('count').textContent='—';}setTimeout(poll,200)}
control('start').then(poll);
</script></body></html>
