<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙鏡頭即時追蹤</title><style>
:root{color-scheme:dark;--bg:#071018;--card:#10202d;--line:#294254;--green:#7be3b2;--muted:#9bb0bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef6f8;font:16px system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1500px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:22px}h1{font-size:25px;margin:0}header p,.muted{color:var(--muted);margin:6px 0 0;font-size:13px}.feeds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.bar{padding:14px 18px;display:flex;justify-content:space-between}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:#71838f;margin-right:8px}.live .dot{background:var(--green);box-shadow:0 0 14px #7be3b288}.view{aspect-ratio:4/3;background:#03090d;display:grid;place-items:center;position:relative}.view img{position:absolute;width:100%;height:100%;object-fit:contain}.overlay{position:absolute;inset:0;pointer-events:none}.box{position:absolute;border:2px solid var(--green);color:var(--green);font-size:12px;font-weight:700}.box span{position:absolute;left:-2px;top:-20px;white-space:nowrap;background:#071018cc;padding:2px 4px}.empty{text-align:center;color:var(--muted);padding:25px;line-height:1.7}.foot{padding:12px 18px;color:var(--muted);font-size:13px}.bottom{display:grid;grid-template-columns:1fr 340px;gap:18px;margin-top:18px}.panel{padding:20px}h2{font-size:15px;margin:0 0 14px}.pairs{min-height:58px;color:var(--muted)}.pair{padding:9px 0;border-bottom:1px solid var(--line)}.tag{color:var(--green);font-weight:700}.photo-section{margin-top:18px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.match-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#091720}.match-title{font-weight:700;color:var(--green);margin-bottom:10px}.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo-pair figure,.person-photo{margin:0;min-width:0}.photo-pair img,.person-photo img{width:100%;height:200px;object-fit:contain;background:#03090d;border-radius:8px}.photo-pair figcaption,.person-photo figcaption{font-size:13px;color:var(--muted);margin-top:5px}.saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-height:360px;overflow:auto}.person-photo img{height:150px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 7px}select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line)}select{width:100%;background:#091720;color:white}button{cursor:pointer;font-weight:700;margin-top:14px}.start{background:var(--green);color:#062217;border:0;width:100%}.stop{background:transparent;color:white;width:100%}.error{background:#552824;color:#ffd8d0;padding:12px;border-radius:8px;margin-bottom:16px}[hidden]{display:none!important}@media(max-width:850px){main{padding:16px}.feeds,.bottom{grid-template-columns:1fr}header{display:block}}
</style></head><body><main><header><div><h1>雙鏡頭即時人物追蹤</h1><p>畫面以最新攝影機影格更新；人物框與候選狀態由背景 AI 分析更新。</p></div><span id="state" class="muted">準備連線</span></header><div id="error" class="error" hidden>無法連接本機服務。</div><section class="feeds"><article class="card"><div class="bar"><span id="aConn"><i class="dot"></i>鏡頭 A</span><span id="aCount">0 人</span></div><div class="view"><img id="aImg" alt="鏡頭 A 即時畫面" hidden><div id="aOverlay" class="overlay"></div><span id="aEmpty" class="empty">正在等待鏡頭 A</span></div><div class="foot" id="aPeople">尚未偵測到人物</div></article><article class="card"><div class="bar"><span id="bConn"><i class="dot"></i>鏡頭 B</span><span id="bCount">0 人</span></div><div class="view"><img id="bImg" alt="鏡頭 B 即時畫面" hidden><div id="bOverlay" class="overlay"></div><span id="bEmpty" class="empty">正在等待鏡頭 B</span></div><div class="foot" id="bPeople">尚未偵測到人物</div></article></section><section class="bottom"><article class="panel"><h2>跨鏡頭外觀候選</h2><div id="pairs" class="pairs">尚未形成候選。兩邊人物外觀需連續三次相似，才會顯示 P 標籤。</div></article><aside class="panel"><h2>控制</h2><label>鏡頭 A 編號</label><select id="cameraA"><option value="0">鏡頭 0</option><option value="1">鏡頭 1</option><option value="2">鏡頭 2</option></select><label>鏡頭 B 編號</label><select id="cameraB"><option value="1">鏡頭 1</option><option value="0">鏡頭 0</option><option value="2">鏡頭 2</option></select><button class="start" id="start">連接雙鏡頭</button><button class="stop" id="stop">停止雙鏡頭</button><p class="muted" id="metrics">畫面 — FPS · AI — FPS · 延遲 — ms</p></aside></section><section class="panel photo-section"><h2>已配對照片（P 為外觀候選，請人工核對）</h2><p id="matchEmpty" class="muted">尚無符合連續三次條件的配對。</p><div id="matchPhotos" class="photo-grid"></div></section><section class="panel photo-section"><h2>本次已保存的人物照片</h2><p class="muted">每個鏡頭的已確認追蹤 ID 各存一張裁切照；重新連線會開始新的本機保存資料夾。</p><p id="savedEmpty" class="muted">尚未保存人物照片。</p><div id="savedPhotos" class="saved-grid"></div></section></main><script>
const $=id=>document.getElementById(id);let lastImage=-1,lastImageAt=0;async function control(name){try{const r=await fetch('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({camera_a:Number($('cameraA').value),camera_b:Number($('cameraB').value)})});if(!r.ok)throw Error();$('error').hidden=true}catch(e){$('error').textContent='無法啟動：請為 A 和 B 選擇不同的可用鏡頭。';$('error').hidden=false}}$('start').onclick=()=>control('start');$('stop').onclick=()=>control('stop');function people(items){return items.length?items.map(x=>`ID ${x.track_id} · ${x.status==='confirmed'?'追蹤中':'建立中'} · ${Math.round(x.confidence*100)}%`).join('　'): '尚未偵測到人物'}function draw(prefix,items){const root=$(prefix+'Overlay');root.replaceChildren();for(const item of items){const [x0,y0,x1,y1]=item.box,box=document.createElement('div'),label=document.createElement('span');box.className='box';box.style.cssText=`left:${x0/6.4}%;top:${y0/4.8}%;width:${(x1-x0)/6.4}%;height:${(y1-y0)/4.8}%`;label.textContent=`${prefix.toUpperCase()}:${item.track_id}`;box.append(label);root.append(box)}}function render(s){const live=s.status==='live',now=Date.now();$('state').textContent=s.message;const viewFps=lastImageAt?Math.round(1000/Math.max(1,now-lastImageAt)):0;$('metrics').textContent=`畫面 ${viewFps||'—'} FPS · AI ${live?s.fps:'—'} FPS · AI 延遲 ${live?s.latency_ms:'—'} ms`;const changed=s.frame_id!==lastImage;for(const [i,prefix] of ['a','b'].entries()){const image=s.images?.[i],img=$(prefix+'Img'),empty=$(prefix+'Empty'),items=s.people?.[i]||[];img.hidden=!image;empty.hidden=!!image;if(image&&changed)img.src='data:image/jpeg;base64,'+image;$(prefix+'Conn').className=live?'live':'';$(prefix+'Count').textContent=items.length+' 人';$(prefix+'People').textContent=people(items);draw(prefix,items)}if(changed){lastImage=s.frame_id;lastImageAt=now}const pairs=s.pairs||[];$('pairs').replaceChildren();if(!pairs.length){$('pairs').textContent='尚未形成候選。兩邊人物外觀需連續三次相似，才會顯示 P 標籤。'}for(const pair of pairs){const line=document.createElement('div');line.className='pair';line.textContent=`A:${pair.a_id} ↔ B:${pair.b_id} · 相似度 ${pair.score} · ${pair.status}`;if(pair.pair_label){const tag=document.createElement('span');tag.className='tag';tag.textContent=' '+pair.pair_label;line.append(tag)}$('pairs').append(line)}}async function poll(){try{const r=await fetch('/api/live',{cache:'no-store'});if(!r.ok)throw Error();render(await r.json());$('error').hidden=true}catch(e){$('error').hidden=false}setTimeout(poll,100)}control('start').then(poll);
</script><script>
let gallerySession=null;
function renderPhotos(state){
  if(state.session!==gallerySession){
    gallerySession=state.session;
    $('savedPhotos').replaceChildren();
    $('matchPhotos').replaceChildren();
  }
  const saved=state.saved_people||[],matches=state.matched_pairs||[];
  $('savedEmpty').hidden=saved.length>0;
  $('matchEmpty').hidden=matches.length>0;
  for(const person of saved){
    const key=`${person.camera}-${person.track_id}`;
    if(Array.from($('savedPhotos').children).some(node=>node.dataset.key===key))continue;
    const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');
    figure.className='person-photo';figure.dataset.key=key;
    img.src=person.photo_url;img.alt=`鏡頭 ${person.camera} 人物 ${person.track_id} 的保存照片`;
    caption.textContent=`鏡頭 ${person.camera} · ID ${person.track_id} · ${person.captured_at}`;
    figure.append(img,caption);$('savedPhotos').append(figure);
  }
  for(const match of matches){
    let card=Array.from($('matchPhotos').children).find(node=>node.dataset.key===match.pair_label);
    if(!card){
      card=document.createElement('article');card.className='match-card';card.dataset.key=match.pair_label;
      const title=document.createElement('div'),photos=document.createElement('div');
      title.className='match-title';photos.className='photo-pair';
      for(const [side,id,url] of [['A',match.a_id,match.photo_a_url],['B',match.b_id,match.photo_b_url]]){
        const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');
        img.src=url;img.alt=`${match.pair_label} 鏡頭 ${side} 人物 ${id} 的保存照片`;
        caption.textContent=`鏡頭 ${side} · ID ${id}`;figure.append(img,caption);photos.append(figure);
      }
      card.append(title,photos);$('matchPhotos').append(card);
    }
    card.firstChild.textContent=`${match.pair_label} · A:${match.a_id} ↔ B:${match.b_id} · 相似度 ${match.score}`;
  }
}
const renderBase=render;
render=function(state){renderBase(state);renderPhotos(state)};
</script></body></html>
